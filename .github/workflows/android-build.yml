
name: Build Aadhi AI APK

on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    branches:
      - 'main'
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare signing key
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
        run: |
          echo "$SIGNING_KEY_BASE64" | base64 --decode > android/app/aadhi-release.jks

      - name: Build APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: gradle -p android assembleDebug

      - name: Prepare release APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk AadhiAI.apk

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: Aadhi-AI-Debug-APK
          path: AadhiAI.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Aadhi AI ${{ github.ref_name }}
          files: AadhiAI.apk
          generate_release_notes: true
