
plugins {
    id 'com.android.application'
}

def hasReleaseSigning =
        file("aadhi-release.jks").exists() &&
        System.getenv("SIGNING_STORE_PASSWORD") != null &&
        System.getenv("SIGNING_KEY_PASSWORD") != null

android {
    namespace 'com.aadhiai.kids'
    compileSdk 35

    defaultConfig {
        applicationId 'com.aadhiai.kids'
        minSdk 23
        targetSdk 35
        versionCode 4
        versionName '1.0.3'
    }

    signingConfigs {
        release {
            storeFile file("aadhi-release.jks")
            storePassword System.getenv("SIGNING_STORE_PASSWORD")
            keyAlias 'aadhi-release'
            keyPassword System.getenv("SIGNING_KEY_PASSWORD')
        }
    }

    buildTypes {
        debug {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }

        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.work:work-runtime:2.10.1'
}
